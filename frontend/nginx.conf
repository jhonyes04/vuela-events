server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.vuelaevents.es; font-src 'self'; connect-src 'self' blob: https://accounts.google.com https://api.vuelaevents.es; frame-src https://accounts.google.com blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.vuelaevents.es; font-src 'self'; connect-src 'self' blob: https://accounts.google.com https://api.vuelaevents.es; frame-src https://accounts.google.com blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # SPA: cualquier ruta que no sea un fichero real vuelve a index.html.
    location / {
        try_files $uri /index.html;
    }
}
