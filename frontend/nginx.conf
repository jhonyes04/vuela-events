server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA: cualquier ruta que no sea un fichero real vuelve a index.html.
    location / {
        try_files $uri /index.html;
    }
}
